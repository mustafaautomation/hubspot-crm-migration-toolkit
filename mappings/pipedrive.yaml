source: pipedrive
title: Northline West
description: >
  US West SMB book exported from Pipedrive. Stage values are Pipedrive stage
  ids. Pipeline 1 is new business; pipeline 2 is partnerships. Synthetic data
  only, on the reserved .example domain.

owners:
  - { name: Avery Chen, email: avery.chen@northline.example }
  - { name: Jordan Hale, email: jordan.hale@northline.example }
  - { name: Riley Okonkwo, email: riley.okonkwo@northline.example }
  - { name: Samir Patel, email: samir.patel@northline.example }
  - { name: Quinn Alvarez, email: quinn.alvarez@northline.example }
  - { name: Morgan Ellis, email: morgan.ellis@northline.example }

properties:
  - { object: companies, name: legacy_external_id, label: Legacy external ID, type: string, fieldType: text, groupName: companyinformation, hasUniqueValue: true, description: Source-system id used for idempotent upserts. }
  - { object: companies, name: legacy_source, label: Legacy source, type: string, fieldType: text, groupName: companyinformation }
  - { object: companies, name: legacy_owner, label: Legacy owner, type: string, fieldType: text, groupName: companyinformation }
  - { object: contacts, name: legacy_external_id, label: Legacy external ID, type: string, fieldType: text, groupName: contactinformation, hasUniqueValue: true, description: Source-system id used for idempotent upserts. }
  - { object: contacts, name: legacy_source, label: Legacy source, type: string, fieldType: text, groupName: contactinformation }
  - { object: contacts, name: legacy_owner, label: Legacy owner, type: string, fieldType: text, groupName: contactinformation }
  - { object: contacts, name: legacy_lead_source, label: Legacy lead source, type: string, fieldType: text, groupName: contactinformation }
  - { object: deals, name: legacy_external_id, label: Legacy external ID, type: string, fieldType: text, groupName: dealinformation, hasUniqueValue: true, description: Source-system id used for idempotent upserts. }
  - { object: deals, name: legacy_source, label: Legacy source, type: string, fieldType: text, groupName: dealinformation }
  - { object: deals, name: legacy_owner, label: Legacy owner, type: string, fieldType: text, groupName: dealinformation }
  - { object: deals, name: legacy_pipeline, label: Legacy pipeline, type: string, fieldType: text, groupName: dealinformation }

pipelines:
  - sourceName: "1"
    hubspotLabel: Northline Sales
    stages:
      - { source: "1", label: New Lead, probability: "0.1" }
      - { source: "2", label: Qualified, probability: "0.2" }
      - { source: "3", label: Discovery, probability: "0.4" }
      - { source: "4", label: Proposal, probability: "0.6" }
      - { source: "5", label: Negotiation, probability: "0.8" }
      - { source: "6", label: Closed Won, probability: "1.0", closedWon: true }
      - { source: "7", label: Closed Lost, probability: "0.0", closedLost: true }
  - sourceName: "2"
    hubspotLabel: Northline Partnerships
    stages:
      - { source: "8", label: Intro, probability: "0.2" }
      - { source: "9", label: Evaluating, probability: "0.5" }
      - { source: "10", label: Agreement, probability: "0.8" }
      - { source: "11", label: Active Partner, probability: "1.0", closedWon: true }
      - { source: "12", label: Declined, probability: "0.0", closedLost: true }

objects:
  companies:
    file: organizations.csv
    idColumn: Organization - ID
    upsertIdProperty: legacy_external_id
    dedupeProperty: domain
    ownerColumn: Organization - Owner
    fields:
      - { column: Organization - Name, property: name, required: true, transforms: [trim] }
      - { column: Organization - Website, property: domain, transforms: [domain] }
      - { column: Organization - Industry, property: industry, transforms: [trim], valueMap: { Software: COMPUTER_SOFTWARE, Manufacturing: MECHANICAL_OR_INDUSTRIAL_ENGINEERING, Healthcare: HOSPITAL_HEALTH_CARE, "Financial Services": FINANCIAL_SERVICES, Logistics: LOGISTICS_AND_SUPPLY_CHAIN, "Professional Services": MANAGEMENT_CONSULTING, Media: ONLINE_MEDIA, Education: E_LEARNING, Insurance: INSURANCE } }
      - { column: Organization - Phone, property: phone, transforms: [phone] }
      - { column: Organization - City, property: city, transforms: [trim] }
      - { column: Organization - State, property: state, transforms: [trim] }
      - { column: Organization - Country, property: country, transforms: [trim] }
      - { column: Organization - Label, property: lifecyclestage, transforms: [trim], valueMap: { Prospect: lead, Customer: customer, Partner: opportunity, "Former Customer": other } }
      - { column: Organization - Employees, property: numberofemployees, transforms: [number] }
  contacts:
    file: people.csv
    idColumn: Person - ID
    upsertIdProperty: legacy_external_id
    dedupeProperty: email
    ownerColumn: Person - Owner
    associations:
      - { column: Person - Organization ID, to: companies }
    fields:
      - { column: Person - Name, property: firstname, required: true, transforms: [split_first] }
      - { column: Person - Name, property: lastname, required: true, transforms: [split_last] }
      - { column: Person - Email, property: email, required: true, transforms: [email] }
      - { column: Person - Title, property: jobtitle, transforms: [trim] }
      - { column: Person - Phone, property: phone, transforms: [phone] }
      - { column: Person - Lead source, property: legacy_lead_source, transforms: [trim] }
      - { column: Person - Label, property: lifecyclestage, transforms: [trim], valueMap: { Subscriber: subscriber, Lead: lead, MQL: marketingqualifiedlead, SQL: salesqualifiedlead, Opportunity: opportunity, Customer: customer, Evangelist: evangelist, Other: other } }
  deals:
    file: deals.csv
    idColumn: Deal - ID
    upsertIdProperty: legacy_external_id
    ownerColumn: Deal - Owner
    dealPipelineColumn: Deal - Pipeline
    dealStageColumn: Deal - Stage
    associations:
      - { column: Deal - Organization ID, to: companies }
      - { column: Deal - Person ID, to: contacts }
    fields:
      - { column: Deal - Title, property: dealname, required: true, transforms: [trim] }
      - { column: Deal - Value, property: amount, transforms: [number] }
      - { column: Deal - Expected close date, property: closedate, required: true, transforms: [date] }
      - { column: Deal - Type, property: dealtype, transforms: [trim], valueMap: { "New Business": newbusiness, Renewal: existingbusiness, Expansion: existingbusiness, Partnership: newbusiness } }
